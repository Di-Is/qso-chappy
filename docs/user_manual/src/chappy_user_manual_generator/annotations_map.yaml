- target: class:MainWindow
  props:
    doc.windowTitleKey:
      text: chappy User Manual
    doc.summaryByScopeKey:
      common:
        text: Review the shared context bar, spectrum view, and status bar that appear in every mode.
      start:
        text: Start mode is the landing screen where you load observation data or an existing project.
      analysis_overview:
        text: Analysis Overview reviews every region's readiness, fit result, and next action.
      analysis_structure:
        text: Analysis Structure edits the region and line hierarchy from Overview.
      identify:
        text: Identify mode focuses on reviewing detections and assigning absorption lines to species and regions.
      continuum:
        text: Continuum mode shapes the continuum curve so later analysis stays stable.
      analysis_region_detail:
        text: Analysis Region Detail prepares fitting conditions, runs the optimiser, and reviews one region's result.
    doc.operationsHeadingKey:
      text: Key Operations
    doc.operationsByScopeKey:
      common:
        - text: Use the context bar to switch modes and invoke shared actions.
        - text: Inspect observed flux, model, and residuals in the spectrum view.
        - text: Adjust the wavelength and flux ranges with the data control panel. Velocity controls depend on the active mode.
        - text: Open Display in the data control panel to show or hide the error spectrum.
        - text: Use mouse wheel vertical scroll to zoom and horizontal scroll to pan.
        - text: Double-click on the spectrum view to center the display on that wavelength (zoom level is preserved).
      start:
        - text: Drag and drop the flux/error FITS pair or a .h5 project onto the main view.
        - text: Open existing projects through the context bar's "Open Project" action.
        - text: Create an empty workspace with “New Project” when starting from scratch.
      analysis_overview:
        - text: Press Enter or double-click a row in the region list to open the region in Region Detail.
        - text: Right-click a row in the region list and choose "Delete region…", or press the Delete key, to remove a region after a confirmation.
        - text: Click a status count in the summary panel to filter the region list.
      analysis_structure:
        - text: '**Spectrum display**: Double-click an absorption region (region) to jump the spectrum to the wavelength span that contains all of its absorption lines (lines); the coloured bands highlight that range.'
        - text: '**Analysis Structure panel**: Collapse the tree while reviewing each line’s type, wavelength span, redshift, velocity window, and Needs badge. The colour chip beside each region matches the spectrum overlay; see [Analysis Structure panel](#analysis-structure-panel) for a quick reference.'
        - text: '**Edit regions**: Rearrange lines and use the visible Structure actions or context menu to merge, split, unlink, or delete items (see [Analysis Structure](../../../operations/analysis-structure.md)). Press Back to Overview at the top of the panel to return to Analysis Overview.'
      identify:
        - text: Pick a preset in the setup header at the top of the side panel, and use the manage button to open the [Preset Management dialog](../../../menus/main_window/dialogs/PresetListDialog.md) so you can add, edit, or remove presets.
        - text: Slide the detection threshold to rebuild the hit list.
        - text: Shift+click an absorption feature on the spectrum to add temporary lines; the temporary line list always shows how they will be grouped into regions.
        - text: Place the cursor over an absorption feature and press V to verify that exact position in the Velocity Plot; hold Shift first when you want to see the all-species preview before deciding. Right-clicking the spectrum and selecting [Show Velocity Plot (V)] opens the plot at the position you right-clicked.
        - text: Press Register all (N groups), or select rows and press Register selected (N groups), to save temporary groups immediately; the status bar reports the created or extended regions, and Undo reverts the registration.
        - text: The confirmed regions in the side panel are the same regions that Analysis Overview lists in its region list. To delete, merge, split, or unlink one, right-click its row and choose Edit region to open Analysis Structure, then follow [Analysis Structure](../../../operations/analysis-structure.md).
      continuum:
        - text: Right-click the spectrum to add a control point, and drag existing points to shape the continuum curve.
        - text: Use Auto Estimate in the side panel to rebuild control points from the current spectrum.
      analysis_region_detail:
        - text: Edit Analysis range [km/s] on a line or multiplet row to set the interval used for analysis.
        - text: Use Display range in the Velocity Plot to reframe all subplots without changing the analysis interval.
        - text: Open Display in the data control panel or right-click the spectrum, or press M, to show Component profiles; each component draws its own curve in the colour of its marker and label, and this toggle is disabled outside Region Detail.
        - text: Select a row in the parameter table to emphasise that component in the spectrum view; its label reads bold and keeps the full name on the top row, while crowded neighbours shorten and alternate onto a second row.
        - text: Lock or unlock parameters in the parameter table shown in the bottom pane to define the search space.
        - text: Press Run fit and adjust masks to refine residuals.
    doc.notesHeadingKey:
      text: Notes & Caveats
    doc.notesByScopeKey:
      common:
        - text: The data control panel is hidden while you stay in Start mode.
      start:
        - text: No spectrum or data controls appear until data has been loaded.
        - text: When dragging FITS files, select both flux and error files together so they are paired automatically.
        - text: Flux/error FITS files that follow the `*_f.fits` and `*_e.fits` pattern are paired automatically; when you pick files with other names, use the prompt to assign flux and error roles.
        - text: Supported FITS inputs are 1D primary HDUs (with optional WCS), binary tables containing WAVELENGTH/WAVE/LAMBDA/WL and FLUX/INTENSITY/COUNTS/DATA columns, or multi-extension files with WAVELENGTH and FLUX (and optionally ERROR/ERR/SIGMA) extensions. Files whose column or extension names do not match cannot be loaded.
      analysis_structure:
        - text: '**Velocity window**: Each line heading in the tree shows its velocity window inline (±… km/s).'
        - text: '**Colour indicator**: The colour chip beside each region matches the vertical band in the spectrum. Double-click when you need to refocus on the matching range.'
        - text: '**Linked-line display**: Lines registered from the same preset link group are displayed as a single representative line with the highest f-value.'
      identify:
        - text: High-S/N spectra can produce many absorption-region candidates and slow down interaction; adjust the detection threshold to keep the list manageable.
        - text: Pressing Register saves the temporary lines to regions immediately without a confirmation step; use Undo when you need to revert a registration.
        - text: When a group heading in the temporary line list carries a warning mark, the lines overlap multiple existing regions; check the assignment in Analysis Structure after registering.
        - text: '**Link groups**: When you add a candidate using a line in a link group, a temporary line is created for every line in that group. After you register them, those lines remain linked in the project.'
      continuum:
        - text: Auto estimation overwrites existing control points; save the current state first.
      analysis_region_detail:
        - text: A Needs badge marks regions that still require optimisation.
        - text: Unlocking too many parameters can destabilise convergence; introduce changes gradually.
        - text: '**Fitting linked lines**: When you add a model to one linked line, components are created for every line in the link. By default, redshift, column density, b parameter, and covering factor are shared; changing one updates all linked components.'
        - text: A component that needs re-optimization shows its value without an uncertainty,
            since the previous fit's uncertainty no longer applies; hover the cell to see that
            previous value in the tooltip.
        - text: The lookback time and comoving distance columns are hidden by default; enable
            them from the column header's right-click menu. Both are recalculated immediately
            when you apply new parameters in the Cosmology Settings dialog.
