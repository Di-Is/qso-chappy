      text: The σ threshold slider and numeric input are always visible on one row and stay synchronized. The heading reports the current candidate count.

- target: objectName:identifyCandidateSectionLabel
  props:
    doc.include: false

- target: objectName:identifyCandidateTable
  props:
    doc.include: true
    doc.scope: identify_panel
    doc.labelKey:
      text: Detection candidate table
    doc.descKey:
      text: Each row shows a candidate's wavelength range, σ score, and status (Unassigned, Tentative, or Registered). A single click only selects a row; double-click it or press Enter to move to the candidate position, then Shift+click the absorption center to add temporary lines.

- target: objectName:identifyCandidateStack
  props:
    doc.include: false

- target: objectName:identifyRegistrationFeedback
  props:
    doc.include: true
    doc.scope: identify_panel
    doc.labelKey:
      text: Registration result
    doc.descKey:
      text: Shows the result after a successful registration. The message clears when the temporary-line workflow changes again.

- target: objectName:identifyTemporaryHeader
  props:
    doc.include: false

- target: objectName:identifyTemporaryTree
  props:
    doc.include: true
    doc.scope: identify_panel
    doc.labelKey:
      text: Temporary lines
    doc.descKey:
      text: Lists temporary lines grouped by the registration result. Group headings show whether the lines will create a new region or be added to an existing one; a warning mark flags overlaps with multiple existing regions.

- target: objectName:identifyTemporaryDeleteButton
  props:
    doc.include: true
    doc.scope: identify_panel
    doc.labelKey:
      text: Delete selection
    doc.descKey:
      text: Remove the highlighted temporary lines from the list.

- target: objectName:identifyTemporaryMoreButton
  props:
    doc.include: true
    doc.scope: identify_panel
    doc.labelKey:
      text: More actions
    doc.descKey:
      text: Open the low-emphasis actions menu. Choose Clear All to empty the temporary line list.

- target: objectName:identifyTemporaryRegisterButton
  props:
    doc.include: true
    doc.scope: identify_panel
    doc.labelKey:
      text: Register
    doc.descKey:
      text: Save temporary groups to regions immediately. With no selection, the label is Register all (N groups); with selected rows, it is Register selected (N groups). Registration can be undone.

- target: objectName:identifyConfirmedCollapsibleHeader
  props:
    doc.include: true
    doc.scope: identify_panel
    doc.labelKey:
      text: Confirmed Regions section header
    doc.descKey:
      text: Click to expand or collapse the confirmed-region list. While collapsed, the summary shows the region count and a representative region and line.

- target: objectName:identifyGroupsTree
  props:
    doc.include: true
    doc.scope: identify_panel
    doc.labelKey:
      text: Confirmed regions
    doc.descKey:
      text: Shows the hierarchy of confirmed regions and their lines. A single click only selects a row and does not move the spectrum view; press Enter or double-click a region or line to move the spectrum view to its range while Identify mode stays active. Right-click a region or line row to select it and choose Open region to open the region in Analysis Region Detail, or Edit region to open it in Analysis Structure; a right-click on a line row targets its parent region.

- target: objectName:velocityPlotContainer
  props:
    doc.include: true
    doc.labelKey:
      text: Velocity Plot
    doc.descByScopeKey:
      identify:
        text: Press V with the cursor over an absorption feature to open the plot immediately at that exact wavelength, or right-click the spectrum and select [Show Velocity Plot (V)]. Press V again or select [Back to Spectrum] to return. Dashed boundaries show the New-candidate analysis range; Display range reframes every subplot without changing candidate data.
      analysis_detail_velocity:
        text: Compare the current region's lines on a shared velocity axis. Display range reframes every subplot and page without changing the line analysis ranges.
    doc.sectionByScope:
      identify: identify_velocity

- target: objectName:velocityPlotInfo
  props:
    doc.include: true
    doc.labelKey:
      text: Velocity plot info
    doc.descByScopeKey:
      identify:
        text: Shows the target line, redshift, and observed wavelength for the active Velocity Plot.
      analysis_detail_velocity:
        text: Shows the current region and line context for the active Velocity Plot.
    doc.sectionByScope:
      identify: identify_velocity

- target: objectName:velocityDisplayHalfWidthSpinBox
  props:
    doc.include: true
    doc.labelKey:
      text: Display range
    doc.descByScopeKey:
      identify:
        text: Set the symmetric view range shared by every Identify Velocity Plot subplot and page. This display-only value does not change New-candidate range, temporary lines, grouping, or scientific Undo history.
      analysis_detail_velocity:
        text: Set the symmetric view range shared by every Velocity Plot subplot and page. This display-only value does not change line analysis ranges or scientific Undo history.
    doc.sectionByScope:
      identify: identify_velocity

- target: objectName:velocityDisplayHalfWidthLabel
  props:
    doc.include: false

- target: objectName:velocityFitViewToAnalysisRangesButton
  props:
    doc.include: true
    doc.labelKey:
      text: Fit view to analysis ranges
    doc.descByScopeKey:
      identify:
        text: Recalculate Display range from New-candidate range. This action changes only the Velocity Plot view.
      analysis_detail_velocity:
        text: Recalculate Display range from the current region's line analysis ranges. This action changes only the Velocity Plot view.
    doc.sectionByScope:
      identify: identify_velocity

- target: objectName:velocityAnalysisRangeSummary
  props:
    doc.include: true
    doc.labelKey:
      text: Analysis-range summary
    doc.descByScopeKey:
      identify:
        text: Reports the New-candidate analysis range represented by the dashed boundaries. Edit the value in the setup header of the Identify side panel.
      analysis_detail_velocity:
        text: Reports the current line analysis ranges represented by dashed boundaries.
    doc.sectionByScope:
      identify: identify_velocity

- target: objectName:velocityDisplayRangeStatus
  props:
    doc.include: false

- target: objectName:velocityPlotCreateButton
  props:
    doc.include: true
    doc.scope: identify
    doc.labelKey:
      text: Add selected lines to temporary list
    doc.descKey:
      text: Add temporary lines for the selected velocity slices; use the side panel's Register action to save them to confirmed regions.
    doc.section: identify_velocity

- target: objectName:velocityPlotExitButton
  props:
    doc.include: true
    doc.labelKey:
      text: Back to Spectrum
    doc.descByScopeKey:
      identify:
        text: Return to the standard spectrum view and re-enable wavelength controls.
      analysis_detail_velocity:
        text: Close the Velocity Plot and return to the standard spectrum view.
    doc.sectionByScope:
      identify: identify_velocity

- target: objectName:velocitySubplotSelection
  props:
    doc.include: true
    doc.scope: identify
    doc.labelKey:
      text: Subplot selector
    doc.descKey:
      text: Toggle whether the subplot’s slice will be promoted into the final grouping.
    doc.section: identify_velocity

- target: objectName:velocityPlotPrevPage
  props:
    doc.include: true
    doc.labelKey:
      text: Previous page
    doc.descKey:
      text: When more than six slices are available, move back to the earlier subplot page.
    doc.sectionByScope:
      identify: identify_velocity

- target: objectName:velocityPlotNextPage
  props:
    doc.include: true
    doc.labelKey:
      text: Next page
    doc.descKey:
      text: When more than six slices are available, advance to the next subplot page.
    doc.sectionByScope:
      identify: identify_velocity

- target: objectName:velocityPlotPageLabel
  props:
    doc.include: true
    doc.labelKey:
      text: Page status
    doc.descKey:
      text: Indicates the current subplot page and the total number of pages.
    doc.sectionByScope:
      identify: identify_velocity

- target: class:CosmologyDialog
  props:
    doc.summaryKey:
      text: Adjust the ΛCDM parameters used to compute comoving distance and lookback time in the analysis.
    doc.operationsHeadingKey:
      text: Key Operations
    doc.operations:
      - text: Editing H₀, Ωm, or ΩΛ immediately recomputes Ωk and the flatness indicator.
      - text: Press Apply Planck2018 to reset the fields to the Planck 2018 recommended values.
      - text: Press OK to save the settings and apply them to the main window.
    doc.notesHeadingKey:
      text: Notes & Caveats
    doc.notes:
      - text: Entered values are stored in the user settings and restored on the next launch.
      - text: When Ωm + ΩΛ exceeds 1, Ωk shows the sign of the curvature.

- target: objectName:cosmologyDescription
  props:
    doc.include: false

- target: objectName:spin_h0
  props:
    doc.descKey:
      text: Specify the Hubble constant H₀ in the range 50.0–100.0 km/s/Mpc. Step 0.1, default 67.4.

- target: objectName:spin_omega_m
  props:
    doc.descKey:
      text: Enter the matter density Ωm in the range 0.000–1.000. Changing it updates Ωk.

- target: objectName:spin_omega_lambda
  props:
    doc.descKey:
      text: Set the dark-energy density ΩΛ in the range 0.000–1.000. It feeds into the Ωk calculation.

- target: objectName:defaultsButton
  props:
    doc.descKey:
      text: Apply the Planck 2018 recommended parameters (67.4, 0.315, 0.685) to the fields.

- target: objectName:okButton
  props:
    doc.descKey:
      text: Save the current settings and close the dialog.

- target: objectName:cancelButton
  props:
    doc.descKey:
      text: Discard the changes and close the dialog.

- target: class:LanguageSettingsDialog
  props:
    doc.summaryKey:
      text: Switch the display language of the whole application and check the wording in the preview.
    doc.operationsHeadingKey:
      text: Key Operations
    doc.operations:
      - text: Choosing a language from the list updates the preview to that language.
      - text: Press OK to apply the selected language immediately.
      - text: Press Cancel to close without changing anything.
    doc.notesHeadingKey:
      text: Notes & Caveats
    doc.notes:
      - text: Loading resources can take a few seconds after changing the language.

- target: objectName:languageComboBox
  props:
    doc.labelKey:
      text: Display language
    doc.descKey:
      text: Choose the display language of the application. The preview below updates to the selected language.

- target: objectName:previewSampleButton
  props:
    doc.descKey:
      text: Show a sample of how menus and buttons appear in the selected language.


- target: class:ObservationDataDialog
  props:
    doc.summaryKey:
      text: Specify the FITS files for the observed flux and error and load them into the project.
    doc.operationsHeadingKey:
      text: Key Operations
    doc.operations:
      - text: Select the flux FITS file with the Browse... button.
      - text: Select the error FITS file as well if needed.
      - text: Press OK to validate the selected files and load them into the project.
    doc.notesHeadingKey:
      text: Notes & Caveats
    doc.notes:
      - text: The supported extension is .fits.
      - text: The error file is optional, but providing it enables uncertainty-aware analysis.

- target: objectName:fluxPathEdit
  props:
    doc.descKey:
      text: Enter the path of the FITS file containing the observed flux. Browse... also opens a file picker.

- target: objectName:fluxBrowseButton
  props:
    doc.descKey:
      text: Choose the flux FITS file from a file dialog.

- target: objectName:errorPathEdit
  props:
    doc.descKey:
      text: Specify the path of the FITS file containing the observed error. When omitted, the data is treated as having no error.

- target: objectName:errorBrowseButton
  props:
    doc.descKey:
      text: Choose the error FITS file from a file dialog.


- target: class:ResolutionDialog
  props:
    doc.summaryKey:
      text: Set the instrument's spectral resolution R and choose how it is applied to model calculations.
    doc.operationsHeadingKey:
      text: Key Operations
    doc.operations:
      - text: Enter the instrument's resolution in the Spectral Resolution R field.
      - text: Turning on Apply Instrument Resolution convolves the resolution into candidate detection in Identify mode and model calculations in Analysis Region Detail.
      - text: Press OK to confirm the value, or Cancel to keep the existing setting.
    doc.notesHeadingKey:
      text: Notes & Caveats
    doc.notes:
      - text: The valid range is 10–100000; values outside it show an error.

- target: objectName:resolutionSpin
  props:
    doc.descKey:
      text: Specify the resolution R = λ/Δλ in the range 10–100000. Up to two decimal places are accepted.

- target: objectName:applyResolutionCheckbox
  props:
    doc.descKey:
      text: When checked, the instrument resolution is convolved into the analysis model. When unchecked, the value is stored but not applied.

- target: class:PresetListDialog
  props:
    doc.summaryKey:
      text: Manage absorption-line presets and choose which lines should be identified and fitted together.
    doc.operationsHeadingKey:
      text: Key Operations
    doc.operations:
      - text: Selecting a preset in the left list shows its composition on the right.
      - text: Edit presets with the New / Duplicate / Rename / Delete buttons.
      - text: Add lines with Add Line and remove them with Remove Selected.
      - text: Select two or more rows and use Link selected lines to create a link group; select a linked row and use Unlink to remove its group.
      - text: Review database-derived link suggestions and use Apply all to accept every valid suggestion.
      - text: Share presets as JSON files with Import... / Export....
    doc.notesHeadingKey:
      text: Notes & Caveats
    doc.notes:
      - text: Built-in presets cannot be edited; duplicate one and save it as a custom preset.
      - text: A link group contains at least two lines of the same ion, and each line can belong to only one link group.
      - text: To change a link group's members, unlink the group and then link the intended rows again.
      - text: Link suggestions are not applied automatically.

- target: objectName:presetListView
  props:
    doc.labelKey:
      text: Preset list
    doc.descKey:
      text: The available presets. Selecting one updates the details and the state of the edit buttons.

- target: objectName:presetNewButton
  props:
    doc.descKey:
      text: Create an empty preset ready for any line composition.

- target: objectName:presetDuplicateButton
  props:
    doc.descKey:
      text: Duplicate the selected preset into an editable copy.

- target: objectName:presetRenameButton
  props:
    doc.descKey:
      text: Rename the preset. Only custom presets can be edited.

- target: objectName:presetDeleteButton
  props:
    doc.descKey:
      text: Delete the selected custom preset.

- target: objectName:presetImportButton
  props:
    doc.descKey:
      text: Load a preset JSON file and add it to the current list.

- target: objectName:presetExportButton
  props:
    doc.descKey:
      text: Export the selected preset as JSON.

- target: objectName:presetLineTable
  props:
    doc.labelKey:
      text: Line species list
    doc.descKey:
      text: Lists the preset's absorption lines and shows their link-group membership in the Link column. Wavelengths, f-values, and link labels are read-only.

- target: objectName:presetAddLineButton
  props:
    doc.descKey:
      text: Open the absorption-line database search dialog and add new absorption lines to the preset.

- target: objectName:presetRemoveLineButton
  props:
    doc.descKey:
      text: Remove the absorption lines selected in the table from the preset.

- target: objectName:presetAddTieGroupButton
  props:
    doc.descKey:
      text: Create a link group from two or more selected lines of the same ion.

- target: objectName:presetRemoveTieGroupButton
  props:
    doc.descKey:
      text: Remove every link group containing one of the selected rows. The lines remain in the preset.

- target: objectName:presetSuggestionBar
  props:
    doc.labelKey:
      text: Suggested links
    doc.descKey:
      text: Shows link groups suggested from multiplets in the line database. Suggestions remain pending until applied.

- target: objectName:presetApplySuggestionsButton
  props:
    doc.descKey:
      text: Apply all currently valid link suggestions to the custom preset.

- target: objectName:presetBaselineCombo
  props:
    doc.labelKey:
      text: Anchor line
    doc.descKey:
      text: Choose the preset's anchor line. When set, it is selected as the default anchor in Identify mode.

- target: objectName:presetButtonBox
  props:
    doc.include: false

- target: class:LineSelectionDialog
  props:
    doc.summaryKey:
      text: Search the absorption-line database for lines and bring them into presets or Identify mode.
    doc.operationsHeadingKey:
      text: Key Operations
    doc.operations:
      - text: Narrow down the candidates with filters for keyword, element, ionisation stage, and wavelength range.
      - text: Select a line in the result list and check its transition data and f-value in the detail preview on the right.
      - text: Organise the additions in the selected list and press Add Lines to apply them to the calling preset.
    doc.notesHeadingKey:
      text: Additional Notes
    doc.notes:
      - text: Lines already in the preset are tagged as selected, and duplicate additions are prevented automatically.
      - text: Selecting or clearing any member of a multiplet applies the same state to every member. When opened from preset management, an explicitly selected multiplet is also proposed as a preset link group.

- target: objectName:filterWarningLabel
  props:
    doc.labelKey:
      text: Filter warning
    doc.descKey:
      text: A warning shown when the filter conditions conflict, such as an invalid wavelength range. It hides automatically once the conditions are fixed.

- target: objectName:filterKeywordEdit
  props:
    doc.labelKey:
      text: Keyword
    doc.descKey:
      text: Enter an element symbol, line ID, transition name, or similar for partial-match search.

- target: objectName:filterElementCombo
  props:
    doc.labelKey:
      text: Element
    doc.descKey:
      text: Filter candidates by element in atomic-number order. Type an element symbol to select it from the suggestions; an empty field removes the restriction.

- target: objectName:filterStageCombo
  props:
    doc.labelKey:
      text: Ionisation stage
    doc.descKey:
      text: Specify the ionisation stage for the selected element. Changing the element updates the available stages.

- target: objectName:filterWavelengthMin
  props:
    doc.include: false

- target: objectName:filterWavelengthMax
  props:
    doc.include: false

- target: objectName:filterWavelengthRange
  props:
    doc.include: true
    doc.labelKey:
      text: Wavelength range
    doc.descKey:
      text: Enter the minimum and maximum within 0–50000 Å to narrow the searched wavelength band. An empty field removes the limit on that side.

- target: objectName:clearFiltersButton
  props:
    doc.descKey:
      text: Reset all entered filter conditions and return the search results to the initial state.

- target: objectName:resultSummaryLabel
  props:
    doc.include: false

- target: objectName:resultHelperLabel
  props:
    doc.include: false

- target: objectName:lineResultTable
  props:
    doc.labelKey:
      text: Search results
    doc.descKey:
      text: Shows the absorption-line candidates with wavelength, type, f-value, and more. Click a column header to change the sort order.

- target: objectName:linePreview
  props:
    doc.labelKey:
      text: Detail preview
    doc.descKey:
      text: Review the selected line's transition levels, oscillator strength, references, and other details as text.

- target: objectName:selectionSummaryLabel
  props:
    doc.include: false

- target: objectName:selectionList
  props:
    doc.labelKey:
      text: Selected lines
    doc.descKey:
      text: Lists the lines scheduled for addition; select unwanted ones to remove them.

- target: objectName:selectionListContainer
  props:
    doc.include: true
    doc.labelKey:
      text: Selection area
    doc.descKey:
      text: The area that lists the selected lines. Guidance text is shown while nothing is selected.

- target: objectName:selectionPlaceholderLabel
  props:
    doc.labelKey:
      text: Selected Line List
    doc.descKey:
      text: The area where the selected line species are shown.

- target: objectName:selectionRemoveButton
  props:
    doc.descKey:
      text: Remove the line species highlighted in the selected list.

- target: objectName:selectionClearButton
  props:
    doc.descKey:
      text: Clear the selected list at once when you want to start over.

- target: objectName:lineSelectionApplyButton
  props:
    doc.descKey:
      text: Add the selected lines to the calling preset and close the dialog.

- target: objectName:lineSelectionCancelButton
  props:
    doc.descKey:
      text: Close the dialog without applying the search results.

- target: class:CloseProjectDialog
  props:
    doc.windowTitleKey:
      text: Close Project
    doc.summaryKey:
      text: Confirm what happens to unsaved changes before the current project is closed.
    doc.operationsHeadingKey:
      text: Key Operations
    doc.operations:
      - text: Press Save to write the project to disk and then close it.
      - text: Press Don't Save to close the project and lose the unsaved changes.
      - text: Press Cancel to keep working in the current project.
    doc.notesHeadingKey:
      text: Notes & Caveats
    doc.notes:
      - text: The dialog only appears while the project has unsaved changes; otherwise the project closes straight away.

- target: objectName:closeProjectMessage
  props:
    doc.descKey:
      text: State that the current project has unsaved changes and ask whether to save them.

- target: objectName:closeProjectDetail
  props:
    doc.descKey:
      text: Show the name of the project that is about to be closed.

- target: objectName:closeProjectGuidance
  props:
    doc.descKey:
      text: Explain that closing returns to Start mode and that the project can be reopened from File > Open Project.

- target: objectName:closeProjectCancelButton
  props:
    doc.labelKey:
      text: Cancel
    doc.descKey:
      text: Keep the project open and leave it unchanged.

- target: objectName:closeProjectDontSaveButton
  props:
    doc.labelKey:
      text: Don't Save
    doc.descKey:
      text: Discard the unsaved changes and close the project.

- target: objectName:closeProjectSaveButton
  props:
    doc.labelKey:
      text: Save
    doc.descKey:
      text: Save the project, then close it and return to Start mode.
