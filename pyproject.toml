[project]
name = "chappy"
version = "0.1.3"
description = "chappy: Code for Handling Absorption Profiles with PYthon (absorption-line analysis client)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Di-Is", email = "rhoxbox@gmail.com" }]
urls = { Homepage = "https://github.com/Di-Is/qso-chappy", Issues = "https://github.com/Di-Is/qso-chappy/issues" }
dependencies = [
  "PySide6>=6.11.1",
  "PyYAML>=6.0.0",
  "astropy>=7.1.0",
  "h5py>=3.11.0",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "python-json-logger>=2.0.0",
  "scipy>=1.11.0",
]

[project.gui-scripts]
chappy = "chappy.__main__:main"

[dependency-groups]
dev = [
  "import-linter>=2.6",
  "markdown>=3.10",
  "mypy>=1.17.0",
  "pyscn>=1.1.1",
  "pytest>=7.4.0",
  "pytest-benchmark>=5.1.0",
  "pytest-cov>=4.1.0",
  "pytest-qt>=4.2.0",
  "pytest-xdist>=3.8.0",
  "ruff==0.15.16",
  "types-pyyaml>=6.0.12.20250915",
  "vulture>=2.14",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.importlinter]
root_package = "chappy"
include_external_packages = true
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
id = "core-no-gui-plotting"
name = "Core must not import GUI or plotting"
type = "forbidden"
source_modules = ["chappy.core"]
forbidden_modules = ["chappy.gui", "chappy.plotting"]

